[pytest]
testpaths = tests

# The `slow` marker was registered here with a hint to deselect it, but nothing
# ever did -- there was no `addopts`. So a plain `pytest tests/unit` ran both of
# these every time:
#
#   tests/unit/test_checklist_audit.py::test_full_audit_zero_violations   ~20-40 min
#   tests/unit/test_parallel_audit.py::test_parallel_audit_matches_serial ~15 min
#
# Each spawns a ProcessPoolExecutor, so the pytest parent sits at 0% CPU while its
# children burn a core each. No output, an idle parent, tens of minutes -- that
# combination was recorded in the hardening ledger as a "pytest tests/unit deadlock"
# and queued as a bug to find. There is no deadlock. Both tests do exactly what their
# own docstrings say, and both docstrings already say to run them with `-m slow`.
#
# `addopts` makes that instruction the actual default, so the fast suite is usable as
# a gate and the slow ones stay opt-in:
#
#   fast (default):  .venv/bin/python -m pytest tests/unit
#   slow only:       .venv/bin/python -m pytest tests/unit -m slow
#   everything:      .venv/bin/python -m pytest tests/unit -m "slow or not slow"
addopts = -m "not slow"

markers =
    slow: full-audit or parallel-equivalence tests that spawn a process pool and take 15-40 minutes. Deselected by default; run with -m slow.
