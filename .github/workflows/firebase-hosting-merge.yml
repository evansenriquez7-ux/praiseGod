# Originally auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# Hand-edited since generation -- do not let `firebase init hosting` regenerate
# over it without re-applying: the install uses `npm ci`, and the deploy has no
# `|| true`. See the comments on those steps for why.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `npm ci` installs exactly package-lock.json and fails if the lockfile
      # and package.json disagree. `npm install` silently resolves new versions
      # of transitive dependencies, so production could change without any
      # commit to this repo and the build would not be reproducible.
      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRAISEGOD_EDU }}

      # No `|| true`. It was there before and it meant a failed deploy reported
      # success -- the workflow went green while the live site kept serving the
      # previous build. That is dangerous in this repo specifically: generator
      # fixes are judged by manually testing the deployed app, so a silently
      # stale frontend produces confident, wrong conclusions about whether a fix
      # worked. It is also the exact silent-pass pattern pgen_hardening.md
      # Phase 3 forbids.
      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@latest deploy --only hosting --project praisegod-edu --non-interactive
